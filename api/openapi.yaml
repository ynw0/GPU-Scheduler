openapi: 3.1.0
info:
  title: GPU Scheduler API
  version: 1.0.0
  description: 单机 GPU 训练调度平台公开 API。
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /health:
    get:
      security: []
      operationId: getHealth
      responses:
        "200":
          description: Controller health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated user; session and CSRF cookies are set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Session revoked }
  /me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /me/password:
    post:
      operationId: changeOwnPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 6 }
      responses:
        "204": { description: Password updated }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /platform:
    get:
      operationId: getPlatform
      responses:
        "200":
          description: Platform settings for authenticated users
          content:
            application/json:
              schema:
                type: object
                required: [allowedMountRoots]
                properties:
                  allowedMountRoots:
                    type: array
                    items: { type: string }
  /topology:
    get:
      operationId: getTopology
      responses:
        "200":
          description: Effective host topology
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topology" }
  /resources/availability:
    get:
      operationId: getResourceAvailability
      responses:
        "200":
          description: Current allocatable resources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }
  /images:
    get:
      operationId: listImages
      responses:
        "200":
          description: Images present on the Docker host
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Image" }
  /unmanaged-containers:
    get:
      operationId: listUnmanagedContainers
      responses:
        "200":
          description: Containers not owned by the platform
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UnmanagedContainer" }
  /unmanaged-containers/{id}:
    patch:
      operationId: patchUnmanagedContainer
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority]
              properties:
                priority: { type: string, enum: [P0, P1, P2, P3] }
      responses:
        "204": { description: Priority updated }
        "409": { description: Managed container }
  /unmanaged-containers/{id}/stop:
    post:
      operationId: stopUnmanagedContainer
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "204": { description: Stopped }
        "409": { description: Managed container }
  /unmanaged-containers/{id}/pause:
    post:
      operationId: pauseUnmanagedContainer
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "204": { description: Paused }
        "409": { description: Managed container }
  /unmanaged-containers/{id}/unpause:
    post:
      operationId: unpauseUnmanagedContainer
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "204": { description: Resumed }
        "409": { description: Managed container }
  /job-plans:
    post:
      operationId: planJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobSpec" }
      responses:
        "200":
          description: Non-reserving scheduling preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobPlan" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /jobs:
    get:
      operationId: listJobs
      responses:
        "200":
          description: Jobs visible to the current user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
    post:
      operationId: createJob
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobSpec" }
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /jobs/{jobId}:
    get:
      operationId: getJob
      parameters: [ { $ref: "#/components/parameters/JobId" } ]
      responses:
        "200":
          description: Job detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }
  /jobs/{jobId}/actions/{action}:
    post:
      operationId: actOnJob
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - in: path
          name: action
          required: true
          schema: { type: string, enum: [start, stop, cancel, retry] }
      responses:
        "202": { description: Action accepted }
        "409": { $ref: "#/components/responses/Conflict" }
  /jobs/{jobId}/heartbeat:
    post:
      operationId: reportTrainingHeartbeat
      parameters: [ { $ref: "#/components/parameters/JobId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingHeartbeat" }
      responses:
        "204": { description: Heartbeat recorded }
  /jobs/{jobId}/metrics:
    get:
      operationId: getJobMetrics
      parameters: [ { $ref: "#/components/parameters/JobId" } ]
      responses:
        "200":
          description: Recent cgroup v1 and GPU metric snapshots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobMetricSnapshot" }
  /jobs/{jobId}/logs/stream:
    get:
      operationId: streamJobLogs
      parameters: [ { $ref: "#/components/parameters/JobId" } ]
      responses:
        "200":
          description: Container log stream
          content:
            text/event-stream:
              schema: { type: string }
  /events/stream:
    get:
      operationId: streamEvents
      responses:
        "200":
          description: Server-sent state and notification events
          content:
            text/event-stream:
              schema: { type: string }
  /compose-sources:
    get:
      operationId: listComposeSources
      responses:
        "200":
          description: Registered Compose sources
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ComposeSource" } }
    post:
      operationId: createComposeSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComposeSourceWrite" }
      responses:
        "201": { description: Created }
  /compose-sources/from-path:
    post:
      operationId: createComposeSourceFromPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filePath]
              properties:
                name: { type: string }
                filePath: { type: string }
      responses:
        "201": { description: Created }
  /compose-sources/upload:
    post:
      operationId: uploadComposeSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                name: { type: string }
                fileName: { type: string }
                content: { type: string }
      responses:
        "201": { description: Created }
  /compose-sources/{id}:
    patch:
      operationId: updateComposeSource
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComposeSourceWrite" }
      responses:
        "204": { description: Updated }
  /templates:
    get:
      operationId: listTemplates
      responses:
        "200": { description: Job templates }
    post:
      operationId: createTemplate
      responses:
        "201": { description: Created }
  /templates/{id}:
    patch:
      operationId: updateTemplate
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "204": { description: Updated }
  /teams:
    get:
      operationId: listTeams
      responses: { "200": { description: Teams } }
    post:
      operationId: createTeam
      responses: { "201": { description: Created } }
  /users:
    get:
      operationId: listUsers
      responses: { "200": { description: Users } }
    post:
      operationId: createUser
      responses: { "201": { description: Created } }
  /users/{id}:
    patch:
      operationId: updateUser
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [Admin, TeamOperator, User, Viewer, Auditor] }
                teamId: { type: string }
                email: { type: string }
                disabled: { type: boolean }
      responses:
        "204": { description: Updated }
  /users/{id}/password:
    post:
      operationId: resetUserPassword
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: { type: string, minLength: 6 }
      responses:
        "204": { description: Password reset }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /quotas:
    get:
      operationId: listQuotas
      responses: { "200": { description: Quotas } }
    post:
      operationId: upsertQuota
      responses: { "200": { description: Saved } }
  /quotas/{id}:
    patch:
      operationId: updateQuota
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { "200": { description: Saved } }
  /resource-pools:
    get:
      operationId: listResourcePools
      responses: { "200": { description: Resource pools } }
    post:
      operationId: createResourcePool
      responses: { "201": { description: Created } }
  /mig/layouts:
    get:
      operationId: listMigLayouts
      responses: { "200": { description: Saved MIG layouts } }
  /mig/layouts/{gpuUuid}:
    put:
      operationId: applyMigLayout
      parameters: [ { name: gpuUuid, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: Applied } }
  /audit-events:
    get:
      operationId: listAuditEvents
      responses: { "200": { description: Audit events } }
  /notifications:
    get:
      operationId: listNotifications
      responses: { "200": { description: Notifications } }
  /notifications/{id}:
    patch:
      operationId: markNotificationRead
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { "204": { description: Notification marked read } }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: gpu_scheduler_session
  parameters:
    JobId:
      in: path
      name: jobId
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: State or resource conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Health:
      type: object
      required: [status, version, agent, warnings]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        agent: { type: string, enum: [online, offline] }
        warnings: { type: array, items: { type: string } }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 6 }
    User:
      type: object
      required: [id, username, role]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { type: string, enum: [Viewer, User, TeamOperator, Admin, Auditor] }
        teamId: { type: [string, "null"], format: uuid }
        email: { type: string }
    Topology:
      type: object
      required: [hostname, cpus, numaNodes, gpus, observedAt]
      properties:
        hostname: { type: string }
        cpus:
          type: array
          items: { $ref: "#/components/schemas/LogicalCPU" }
        numaNodes:
          type: array
          items: { $ref: "#/components/schemas/NUMANode" }
        gpus:
          type: array
          items: { $ref: "#/components/schemas/GPU" }
        observedAt: { type: string, format: date-time }
    LogicalCPU:
      type: object
      required: [id, coreId, socketId, numaNode, siblings, allocatable]
      properties:
        id: { type: integer, minimum: 0 }
        coreId: { type: integer, minimum: 0 }
        socketId: { type: integer, minimum: 0 }
        numaNode: { type: integer, minimum: 0 }
        siblings: { type: array, items: { type: integer } }
        allocatable: { type: boolean }
    NUMANode:
      type: object
      required: [id, memoryBytes, cpuIds]
      properties:
        id: { type: integer, minimum: 0 }
        memoryBytes: { type: integer, minimum: 0 }
        cpuIds: { type: array, items: { type: integer } }
    GPU:
      type: object
      required: [uuid, index, name, pciBusId, numaNode, memoryBytes, healthy]
      properties:
        uuid: { type: string }
        index: { type: integer, minimum: 0 }
        name: { type: string }
        pciBusId: { type: string }
        numaNode: { type: integer, minimum: 0 }
        memoryBytes: { type: integer, minimum: 0 }
        healthy: { type: boolean }
    Availability:
      type: object
      required: [cpuIds, gpuUuids, memoryByNuma]
      properties:
        cpuIds: { type: array, items: { type: integer } }
        gpuUuids: { type: array, items: { type: string } }
        memoryByNuma:
          type: object
          additionalProperties: { type: integer }
    Image:
      type: object
      required: [id, repository, tag, sizeBytes, createdAt]
      properties:
        id: { type: string }
        repository: { type: string }
        tag: { type: string }
        sizeBytes: { type: integer }
        createdAt: { type: string, format: date-time }
    ResourceRequest:
      type: object
      required: [cpuMode, cpuCount, gpuMode, gpuCount, memoryBytes, numaPolicy]
      properties:
        cpuMode: { type: string, enum: [auto-cores, manual-threads] }
        cpuCount: { type: integer, minimum: 0 }
        cpuIds: { type: array, items: { type: integer } }
        gpuKind: { type: string, enum: [whole, mig] }
        gpuMode: { type: string, enum: [auto, manual] }
        gpuCount: { type: integer, minimum: 0 }
        gpuUuids: { type: array, items: { type: string } }
        migProfile: { type: string }
        memoryBytes: { type: integer, minimum: 0 }
        numaPolicy: { const: strict }
    ImageWorkload:
      type: object
      required: [kind, image]
      properties:
        kind: { const: image }
        image: { type: string }
        command: { type: array, items: { type: string } }
        entrypoint: { type: array, items: { type: string } }
        workingDirectory: { type: string }
        environment:
          type: object
          additionalProperties: { type: string }
        mounts:
          type: array
          items:
            type: object
            required: [source, target]
            properties:
              source: { type: string }
              target: { type: string }
              readOnly: { type: boolean }
        user: { type: string }
        shmSizeBytes: { type: integer, minimum: 1 }
        network: { type: string }
        publishedPorts:
          type: array
          items:
            type: object
            required: [hostPort, containerPort]
            properties:
              hostPort: { type: integer, minimum: 1, maximum: 65535 }
              containerPort: { type: integer, minimum: 1, maximum: 65535 }
              protocol: { type: string, enum: [tcp, udp, sctp], default: tcp }
    ComposeWorkload:
      type: object
      required: [kind, composeSourceId, services]
      properties:
        kind: { const: compose }
        composeSourceId: { type: string, format: uuid }
        services:
          type: array
          items:
            type: object
            required: [name, class, resources]
            properties:
              name: { type: string }
              class: { type: string, enum: [training, auxiliary] }
              resources: { $ref: "#/components/schemas/ResourceRequest" }
    JobSpec:
      type: object
      required: [name, priority, workload, resources]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        priority: { type: string, enum: [P0, P1, P2, P3], default: P2 }
        workload:
          oneOf:
            - { $ref: "#/components/schemas/ImageWorkload" }
            - { $ref: "#/components/schemas/ComposeWorkload" }
          discriminator: { propertyName: kind }
        resources: { $ref: "#/components/schemas/ResourceRequest" }
        resourcePoolId: { type: string, format: uuid }
        stopGraceSeconds: { type: integer, minimum: 1, maximum: 600, default: 30 }
    JobPlan:
      type: object
      required: [schedulable, cpuIds, gpuUuids, numaNodes, conflicts, warnings]
      properties:
        schedulable: { type: boolean }
        cpuIds: { type: array, items: { type: integer } }
        gpuUuids: { type: array, items: { type: string } }
        numaNodes: { type: array, items: { type: integer } }
        conflicts: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
    Job:
      type: object
      required: [id, name, state, priority, ownerId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        state: { type: string }
        priority: { type: string, enum: [P0, P1, P2, P3] }
        ownerId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastError: { type: string }
    TrainingHeartbeat:
      type: object
      required: [phase]
      properties:
        phase: { type: string, enum: [TRAINING, CHECKPOINTING, EVALUATING] }
        epoch: { type: integer, minimum: 0 }
        step: { type: integer, minimum: 0 }
        progress: { type: number, minimum: 0, maximum: 1 }
    JobMetricSnapshot:
      type: object
      required: [sampledAt, cpuPercentById, memoryUsedBytes, memoryLimitBytes, memoryFailCount, oomUnder, blockIoReadBytes, blockIoWriteBytes, gpus, containers]
      properties:
        sampledAt: { type: string, format: date-time }
        cpuPercentById:
          type: object
          additionalProperties: { type: number, minimum: 0 }
        memoryUsedBytes: { type: integer, minimum: 0 }
        memoryLimitBytes: { type: integer, minimum: 0 }
        memoryFailCount: { type: integer, minimum: 0 }
        oomUnder: { type: boolean }
        blockIoReadBytes: { type: integer, minimum: 0 }
        blockIoWriteBytes: { type: integer, minimum: 0 }
        gpus:
          type: array
          items:
            type: object
            required: [uuid, utilizationPercent, memoryUsedBytes, memoryTotalBytes, temperatureCelsius, powerWatts]
            properties:
              uuid: { type: string }
              utilizationPercent: { type: integer, minimum: 0, maximum: 100 }
              memoryUsedBytes: { type: integer, minimum: 0 }
              memoryTotalBytes: { type: integer, minimum: 0 }
              temperatureCelsius: { type: integer }
              powerWatts: { type: number }
        containers:
          type: array
          items:
            type: object
            required: [sampledAt, containerId, cpuPercentById, cpuUsageNs, cpuQuotaMicros, cpuPeriodMicros, cpuQuotaCores, memoryUsedBytes, memoryLimitBytes, memoryFailCount, oomUnder, cpuIds, numaNodes, blockIoReadBytes, blockIoWriteBytes]
            properties:
              sampledAt: { type: string, format: date-time }
              containerId: { type: string }
              cpuPercentById:
                type: object
                additionalProperties: { type: number, minimum: 0 }
              cpuUsageNs: { type: integer, minimum: 0 }
              cpuQuotaMicros: { type: integer, minimum: -1 }
              cpuPeriodMicros: { type: integer, minimum: 1 }
              cpuQuotaCores: { type: number, minimum: 0 }
              memoryUsedBytes: { type: integer, minimum: 0 }
              memoryLimitBytes: { type: integer, minimum: 0 }
              memoryFailCount: { type: integer, minimum: 0 }
              oomUnder: { type: boolean }
              cpuIds: { type: array, items: { type: integer, minimum: 0 } }
              numaNodes: { type: array, items: { type: integer, minimum: 0 } }
              blockIoReadBytes: { type: integer, minimum: 0 }
              blockIoWriteBytes: { type: integer, minimum: 0 }
    UnmanagedContainer:
      type: object
      required: [id, name, image, state, cpuUnbounded, gpuUnbounded]
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string }
        state: { type: string }
        cpuUnbounded: { type: boolean }
        gpuUnbounded: { type: boolean }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        conflicts: { type: array, items: { type: string } }
    ComposeSource:
      type: object
      required: [id, name, rootPath, entryFile, enabled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        rootPath: { type: string }
        entryFile: { type: string }
        enabled: { type: boolean }
    ComposeSourceWrite:
      type: object
      required: [name, rootPath, entryFile]
      properties:
        name: { type: string, minLength: 1 }
        rootPath: { type: string, minLength: 1 }
        entryFile: { type: string, minLength: 1 }
        enabled: { type: boolean }
