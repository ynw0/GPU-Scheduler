name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    steps:
      - name: Target build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends build-essential ca-certificates git python3 python3-pip

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: internal/webui/frontend/pnpm-lock.yaml

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Frontend dependencies
        working-directory: internal/webui/frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend type check and build
        working-directory: internal/webui/frontend
        run: |
          pnpm run check
          pnpm run build

      - name: Go tests
        run: go test ./...

      - name: Linux production builds
        run: |
          CGO_ENABLED=0 go build -o /tmp/gpu-scheduler-controller ./cmd/controller
          CGO_ENABLED=0 go build -o /tmp/gpu-scheduler-admin ./cmd/admin
          CGO_ENABLED=1 go build -o /tmp/gpu-scheduler-agent ./cmd/agent

      - name: Deployment script syntax
        run: bash -n deploy/build-linux.sh deploy/install-linux.sh deploy/backup.sh

      - name: OpenAPI YAML syntax
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python tools/verify_openapi.py
